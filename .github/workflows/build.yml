            private fun drawWorld(c:Canvas){val pal=w.cur;val key=((pal.top shr 3).toLong() shl 32) or ((pal.bot shr 3).toLong() and 0xFFFFFFFFL);if(key!=bgK||bgG==null){bgK=key;bgG=LinearGradient(0f,0f,0f,H,pal.top,pal.bot,Shader.TileMode.CLAMP)};pB.shader=bgG;c.drawRect(0f,0f,UW,H,pB);if(pal.rays>.02f){if(rayG==null||rayH!=H){rayH=H;rayG=LinearGradient(0f,0f,0f,H*.85f,0x55FFFFFF,0x00FFFFFF,Shader.TileMode.CLAMP)};pR.shader=rayG;for(i in 0..2){c.save();c.translate(UW*(.2f+.3f*i),0f);c.rotate((i-1)*9f+sin(w.t*.1f+i*2f)*4f);pR.alpha=(pal.rays*(.5f+.2f*sin(w.t*.3f+i))*255f).toInt().coerceIn(0,255);c.drawRect(-30f,-10f,30f,H*.85f,pR);c.restore()}};val fc=withAlpha(mix(pal.top,pal.bot,.6f),110);val nc=withAlpha(shade(pal.bot,.55f),230);drawWall(c,w.walls[0],false,fc);drawWall(c,w.walls[1],true,fc);drawWall(c,w.walls[2],false,nc);drawWall(c,w.walls[3],true,nc);if(pal.vent>.02f)Art.glowR(c,-UW*.25f,H-100f,UW*1.25f,H+140f,pal.acc,.22f*pal.vent*(.75f+.25f*sin(w.t*.8f)));drawSnow(c,0);drawSnow(c,1);for(i in 0 until w.haz.size)drawHB(c,w.haz[i]);if(pal.dark>.02f){var hx=w.px;var hy=w.py;var hr=70f+(w.light/w.maxLight)*110f;if(w.mode==3)hr*=max(0f,1f-w.deathT/1.3f);if(w.mode==4){hx=w.dx0;hy=w.dy0;hr=34f};val qr=max(8f,(hr/8f).toInt()*8f);val col=withAlpha(shade(pal.bot,.4f),(pal.dark*255).toInt());val dk=(qr.toLong() shl 32) or (col.toLong() and 0xFFFFFFFFL);if(dk!=dkK||dkG==null){dkK=dk;dkG=RadialGradient(0f,0f,qr,intArrayOf(0,withAlpha(col,(pal.dark*90).toInt()),col),floatArrayOf(0f,.45f,1f),Shader.TileMode.CLAMP)};dkM.setTranslate(hx,hy);dkG!!.setLocalMatrix(dkM);pD.shader=dkG;pD.alpha=255;c.drawRect(0f,0f,UW,H,pD)};for(i in 0 until w.haz.size)drawHG(c,w.haz[i]);for(i in 0 until w.motes.size){val m=w.motes[i];if(m.pearl){val tw=.8f+.2f*sin(w.t*3f+m.ph);Art.glow(c,m.x,m.y,20f*tw,0xFFF6F2FF.toInt(),.8f);pF.color=0xFFF6F2FF.toInt();c.drawCircle(m.x,m.y,6f,pF);pF.color=0xFFFFFFFF.toInt();c.drawCircle(m.x-2f,m.y-2f,2f,pF);pS.color=withAlpha(0xFFFF9BEA.toInt(),(140*tw).toInt());p