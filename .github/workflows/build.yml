name: Build APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: code
        run: |
          mkdir -p app/src/main/java/ru/glubina/game
          cat > settings.gradle.kts <<'E1'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "Glubina"; include(":app")
          E1
          cat > build.gradle.kts <<'E2'
          plugins { id("com.android.application") version "8.7.3" apply false; id("org.jetbrains.kotlin.android") version "2.0.21" apply false }
          E2
          cat > app/build.gradle.kts <<'E3'
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }
          android { namespace = "ru.glubina.game"; compileSdk = 35
            defaultConfig { applicationId = "ru.glubina.game"; minSdk = 24; targetSdk = 35; versionCode = 1; versionName = "1.0" }
            compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
            kotlinOptions { jvmTarget = "17" } }
          E3
          cat > app/src/main/AndroidManifest.xml <<'E4'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.VIBRATE"/>
            <application android:allowBackup="true" android:label="Глубина" android:theme="@android:style/Theme.Material.NoActionBar">
              <activity android:name=".MainActivity" android:exported="true" android:screenOrientation="portrait">
                <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
              </activity>
            </application>
          </manifest>
          E4
          cat > app/src/main/java/ru/glubina/game/Game.kt <<'E5'
          package ru.glubina.game
          import android.annotation.SuppressLint
          import android.app.Activity
          import android.content.Context
          import android.graphics.*
          import android.graphics.drawable.ColorDrawable
          import android.media.AudioAttributes
          import android.media.SoundPool
          import android.os.*
          import android.view.*
          import java.io.BufferedOutputStream
          import java.io.File
          import java.io.FileOutputStream
          import java.util.Locale
          import java.util.concurrent.ConcurrentHashMap
          import kotlin.math.*
          import kotlin.random.Random
          const val UW = 420f
          const val TAU = 6.2831855f
          private fun rnd(a: Float, b: Float) = a + Random.nextFloat() * (b - a)
          fun mix(a: Int, b: Int, t: Float): Int { val u = 1f - t
            val A = ((a ushr 24 and 255) * u + (b ushr 24 and 255) * t).toInt()
            val R = ((a ushr 16 and 255) * u + (b ushr 16 and 255) * t).toInt()
            val G = ((a ushr 8 and 255) * u + (b ushr 8 and 255) * t).toInt()
            val B = ((a and 255) * u + (b and 255) * t).toInt()
            return (A shl 24) or (R shl 16) or (G shl 8) or B }
          fun shade(c: Int, f: Float): Int { val a = c ushr 24 and 255
            val r = ((c ushr 16 and 255) * f).toInt().coerceIn(0, 255)
            val g = ((c ushr 8 and 255) * f).toInt().coerceIn(0, 255)
            val b = ((c and 255) * f).toInt().coerceIn(0, 255)
            return (a shl 24) or (r shl 16) or (g shl 8) or b }
          fun withAlpha(c: Int, a: Int) = (c and 0x00FFFFFF) or (a.coerceIn(0, 255) shl 24)
          class UpgDef(val n: String, val d: String, val m: Int, val c: IntArray)
          val UPG = arrayOf(UpgDef("Ядро света","+10 макс. света",5,intArrayOf(3,5,8,12,18)),
            UpgDef("Магнит","+9 радиус",5,intArrayOf(2,4,7,11,16)),
            UpgDef("Резонанс","-0.45с откат, +12 радиус",4,intArrayOf(4,7,12,18)),
            UpgDef("Стойкость","-7% урона",4,intArrayOf(3,6,10,15)))
          class Store(ctx: Context) { private val p = ctx.getSharedPreferences("g", 0)
            var bd: Int get() = p.getInt("bd",0); set(v){p.edit().putInt("bd",v).apply()}
            var bs: Int get() = p.getInt("bs",0); set(v){p.edit().putInt("bs",v).apply()}
            var pe: Int get() = p.getInt("pe",0); set(v){p.edit().putInt("pe",v).apply()}
            var mu: Boolean get() = p.getBoolean("mu",false); set(v){p.edit().putBoolean("mu",v).apply()}
            var hi: Boolean get() = p.getBoolean("hi",false); set(v){p.edit().putBoolean("hi",v).apply()}
            fun lv(i:Int)=p.getInt("u$i",0); fun sl(i:Int,v:Int){p.edit().putInt("u$i",v).apply()} }
          object Art { private val sp = HashMap<Int,Bitmap>()
            private val gp = Paint(Paint.ANTI_ALIAS_FLAG).apply{isFilterBitmap=true}; private val gr = RectF()
            val bell = LinearGradient(0f,-11f,0f,6f,intArrayOf(0xE6BFF6FF.toInt(),0x9935C8E8.toInt(),0x33158FB0.toInt()),floatArrayOf(0f,.6f,1f),Shader.TileMode.CLAMP)
            val pred = Path().apply{ moveTo(-23f,0f);quadTo(-10f,-11f,8f,-6f);quadTo(20f,-3f,23f,0f);quadTo(20f,3f,8f,6f);quadTo(-10f,11f,-23f,0f);close();moveTo(-22f,0f);lineTo(-33f,-8f);lineTo(-29f,0f);lineTo(-33f,8f);close() }
            fun spr(col:Int):Bitmap{ sp[col]?.let{return it}; val s=96; val b=Bitmap.createBitmap(s,s,Bitmap.Config.ARGB_8888); val c=Canvas(b)
              val core=mix(col,0xFFFFFFFF.toInt(),.75f)
              val g=RadialGradient(s/2f,s/2f,s/2f,intArrayOf(withAlpha(core,255),withAlpha(col,225),withAlpha(col,90),withAlpha(col,0)),floatArrayOf(0f,.18f,.5f,1f),Shader.TileMode.CLAMP)
              val p=Paint(Paint.ANTI_ALIAS_FLAG);p.shader=g;c.drawRect(0f,0f,s.toFloat(),s.toFloat(),p);sp[col]=b;return b }
            fun glow(c:Canvas,x:Float,y:Float,r:Float,col:Int,a:Float){ if(r<=.5f||a<=.01f)return; gp.alpha=(a.coerceIn(0f,1f)*255).toInt(); gr.set(x-r,y-r,x+r,y+r); c.drawBitmap(spr(col),null,gr,gp) }
            fun glowR(c:Canvas,l:Float,t:Float,r:Float,b:Float,col:Int,a:Float){ if(a<=.01f)return; gp.alpha=(a.coerceIn(0f,1f)*255).toInt(); gr.set(l,t,r,b); c.drawBitmap(spr(col),null,gr,gp) } }
          class Audio(ctx: Context) { private val cx=ctx.applicationContext; private val sr=22050
            private val nm=arrayOf("collect","pearl","pulse","hit","shatter","zone","ui","deny","death","warn","dash","amb")
            private val ids=ConcurrentHashMap<String,Int>(); private val ld=ConcurrentHashMap.newKeySet<Int>()
            @Volatile private var pool:SoundPool?=null; @Volatile var ready=false; @Volatile var muted=false
            @Volatile private var hp=false; @Volatile private var st=false; private var amb=0; private val av=.45f
            private val rt=floatArrayOf(1f,1.125f,1.25f,1.5f,1.6667f,2f)
            fun init(){ if(st)return; st=true; Thread{ try{ val d=File(cx.cacheDir,"s1");d.mkdirs()
              for(n in nm){val f=File(d,"$n.wav"); if(!f.exists()||f.length()<100) wav(f,gen(n))}
              val at=AudioAttributes.Builder().setUsage(AudioAttributes.USAGE_GAME).setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION).build()
              val p=SoundPool.Builder().setMaxStreams(10).setAudioAttributes(at).build()
              p.setOnLoadCompleteListener{_,id,s-> if(s==0){ld.add(id); if(id==ids["amb"])amb(); if(ld.size>=nm.size)ready=true}}
              for(n in nm)ids[n]=p.load(File(d,"$n.wav").absolutePath,1); pool=p }catch(_:Exception){} }.start() }
            fun play(n:String,v:Float=1f,r:Float=1f){ if(!ready||muted)return; val id=ids[n]?:return; if(!ld.contains(id))return; pool?.play(id,v,v,1,0,r.coerceIn(.5f,2f)) }
            fun collect(c:Int)=play("collect",.8f,rt[(c-1).coerceIn(0,5)]); fun pearl()=play("pearl",.9f); fun pulse()=play("pulse",.95f)
            fun hit()=play("hit",1f); fun shatter()=play("shatter",.7f); fun zone()=play("zone",.75f); fun ui()=play("ui",.5f)
            fun deny()=play("deny",.6f); fun death()=play("death",.9f); fun warn()=play("warn",.45f); fun dash()=play("dash",.7f)
            private fun amb(){ val p=pool?:return; val id=ids["amb"]?:return; if(!ld.contains(id)||muted||hp)return; if(amb==0)amb=p.play(id,av,av,0,-1,1f) else p.setVolume(amb,av,av) }
            fun setMuted(m:Boolean){muted=m; if(m){if(amb!=0)pool?.setVolume(amb,0f,0f)}else amb()}
            fun duck(on:Boolean){ if(muted||amb==0)return; val v=if(on).12f else av; pool?.setVolume(amb,v,v) }
            fun hPause(){hp=true;pool?.autoPause()}; fun hResume(){hp=false;pool?.autoResume();amb()}
            private fun buf(s:Float)=FloatArray((sr*s).toInt())
            private fun tone(s:Float,f:Float,dec:Float,amp:Float,h2:Float=0f):FloatArray{val o=buf(s);for(i in o.indices){val t=i/sr.toFloat();var v=sin(TAU*f*t)*exp(-t*dec);if(h2>0f)v+=h2*sin(TAU*f*2f*t)*exp(-t*dec*1.7f);o[i]=v*amp};return o}
            private fun sw(s:Float,f0:Float,f1:Float,dec:Float,na:Float,nd:Float,lp:Float,seed:Int,amp:Float):FloatArray{val o=buf(s);var ph=0f;var l=0f;val r=Random(seed);for(i in o.indices){val t=i/sr.toFloat();ph+=TAU*(f0+(f1-f0)*(t/s))/sr;l+=lp*(r.nextFloat()*2f-1f-l);o[i]=(sin(ph)*exp(-t*dec)+l*na*exp(-t*nd))*amp};return o}
            private fun add(a:FloatArray,b:FloatArray){for(i in a.indices)if(i<b.size)a[i]+=b[i]}
            private fun gen(n:String):FloatArray{ when(n){
              "collect"->return tone(.18f,523.25f,18f,.8f,.35f)
              "pearl"->{val o=tone(.6f,660f,5f,.48f);add(o,tone(.6f,990f,7f,.32f));add(o,tone(.6f,1320f,10f,.2f));return o}
              "pulse"->return sw(.5f,130f,40f,5f,1.6f,7f,.12f,11,.85f)
              "hit"->return sw(.3f,150f,50f,12f,.5f,20f,1f,12,.9f)
              "shatter"->{val o=buf(.12f);val r=Random(13);var pv=0f;for(i in o.indices){val t=i/sr.toFloat();val w=r.nextFloat()*2f-1f;o[i]=(w-pv)*exp(-t*28f)*.8f;pv=w};return o}
              "zone"->{val o=buf(1.1f);val fs=floatArrayOf(392f,523.25f,659.25f);for(k in 0..2){val s=(k*.16f*sr).toInt();for(i in s until o.size){val t=(i-s)/sr.toFloat();o[i]+=sin(TAU*fs[k]*t)*exp(-t*7f)*.32f}};return o}
              "ui"->return tone(.06f,880f,40f,.5f)
              "deny"->{val o=tone(.15f,160f,18f,.5f);add(o,tone(.15f,120f,18f,.2f));return o}
              "death"->return sw(1.3f,330f,82f,2.2f,1.2f,3f,.05f,14,.8f)
              "warn"->return tone(.12f,220f,22f,.5f)
              "dash"->return sw(.3f,90f,60f,9f,1.4f,6f,.3f,15,.8f)
              else->{val n6=sr*6;val o=FloatArray(n6);val fs=floatArrayOf(55f,110f,165f,220f);val am=floatArrayOf(.5f,.3f,.18f,.1f);val lk=floatArrayOf(1f,2f,3f,2f);val no=FloatArray(n6);var lp=0f;val r=Random(7);for(i in 0 until n6){lp+=.03f*(r.nextFloat()*2f-1f-lp);no[i]=lp};val fd=(sr*.4f).toInt();for(i in 0 until fd){val w=i/fd.toFloat();no[i]=no[i]*w+no[n6-fd+i]*(1f-w)};var pk=.0001f;for(i in 0 until n6){val t=i/sr.toFloat();var v=0f;for(k in 0..3){val l=.6f+.4f*sin(TAU*(lk[k]/6f)*t+k*1.7f);v+=sin(TAU*fs[k]*t+k*.9f)*am[k]*l};v+=no[i]*1.5f*(.6f+.4f*sin(TAU*(1f/6f)*t));o[i]=v;val a=if(v<0)-v else v;if(a>pk)pk=a};val g=.82f/pk;for(i in 0 until n6)o[i]*=g;return o} } }
            private fun wav(f:File,s:FloatArray){val o=BufferedOutputStream(FileOutputStream(f));fun w16(v:Int){o.write(v and 255);o.write((v ushr 8) and 255)};fun w32(v:Int){w16(v and 65535);w16((v ushr 16) and 65535)};fun tg(t:String){o.write(t.toByteArray(Charsets.US_ASCII))};val dl=s.size*2;tg("RIFF");w32(36+dl);tg("WAVE");tg("fmt ");w32(16);w16(1);w16(1);w32(sr);w32(sr*2);w16(2);w16(16);tg("data");w32(dl);for(v in s)w16((v.coerceIn(-1f,1f)*32767f).toInt() and 65535);o.flush();o.close()} }
          class Pal(var top:Int,var bot:Int,var acc:Int,var mote:Int,var rays:Float,var dark:Float,var vent:Float){
            fun set(o:Pal){top=o.top;bot=o.bot;acc=o.acc;mote=o.mote;rays=o.rays;dark=o.dark;vent=o.vent}
            fun lerp(a:Pal,b:Pal,t:Float){top=mix(a.top,b.top,t);bot=mix(a.bot,b.bot,t);acc=mix(a.acc,b.acc,t);mote=mix(a.mote,b.mote,t);rays=a.rays+(b.rays-a.rays)*t;dark=a.dark+(b.dark-a.dark)*t;vent=a.vent+(b.vent-a.vent)*t} }
          class Zone(val n:String,val at:Float,val sp:Float,val k:Int,val sm:Float,val p:Pal)
          val ZONES=arrayOf(
            Zone("ОТМЕЛЬ",0f,70f,1,1f,Pal(0xFF0B4F63.toInt(),0xFF06283C.toInt(),0xFF35E0C8.toInt(),0xFF7CF5D8.toInt(),1f,0f,0f)),
            Zone("СУМЕРКИ",150f,84f,3,1f,Pal(0xFF123A6B.toInt(),0xFF071B38.toInt(),0xFF4FA8FF.toInt(),0xFF8FD0FF.toInt(),.35f,.28f,0f)),
            Zone("ПОЛНОЧЬ",400f,97f,3,1f,Pal(0xFF1B2360.toInt(),0xFF0A0E2A.toInt(),0xFF8B7CFF.toInt(),0xFFB9A8FF.toInt(),0f,.55f,0f)),
            Zone("БЕЗДНА",750f,110f,3,1f,Pal(0xFF171040.toInt(),0xFF060418.toInt(),0xFFFF4FD8.toInt(),0xFFFF9BEA.toInt(),0f,.78f,0f)),
            Zone("РАЗЛОМ",1200f,124f,7,1f,Pal(0xFF241028.toInt(),0xFF090310.toInt(),0xFFFF9A3D.toInt(),0xFFFFC46B.toInt(),0f,.85f,1f)),
            Zone("СЕРДЦЕ БЕЗДНЫ",1800f,138f,7,.9f,Pal(0xFF0A1420.toInt(),0xFF020507.toInt(),0xFF3DFFB0.toInt(),0xFFA5FFD6.toInt(),0f,.9f,.5f)))
          class Mote{var x=0f;var y=0f;var vx=0f;var ph=0f;var pearl=false;var mag=false}
          class Haz{var k=0;var x=0f;var y=0f;var vx=0f;var dir=1f;var ph=0f;var rot=0f;var st=0;var t=0f;var by=0f;var tn=0;val tr=FloatArray(48);val path=Path()}
          class Ptc{var x=0f;var y=0f;var vx=0f;var vy=0f;var life=0f;var max=1f;var size=4f;var col=0;var k=0}
          class Ftx{var x=0f;var y=0f;var life=0f;var max=1f;var size=10f;var col=0;var s=""}
          class Snow{var x=0f;var y=0f;var z=0;var ph=0f}
          class Wall(val mul:Float,val amp:Float,seed:Int){var pts=FloatArray(0);var off=0f;private var last=10f;private val r=Random(seed)
            fun rebuild(h:Float){val n=(h/26f).toInt()+4;pts=FloatArray(n);var v=amp*.5f;for(i in 0 until n){v=(v+(r.nextFloat()-.5f)*16f).coerceIn(3f,amp);pts[i]=v};last=v}
            fun step(d:Float){off+=d*mul;while(off>=26f){off-=26f;if(pts.size>1){System.arraycopy(pts,1,pts,0,pts.size-1);last=(last+(r.nextFloat()-.5f)*16f).coerceIn(3f,amp);pts[pts.size-1]=last}}} }
          class World(private val store:Store,private val audio:Audio){
            var H=800f;var t=0f;var mode=0;var px=UW/2f;var py=340f;var pvx=0f;var pvy=0f;val pr=8f
            var tx=UW/2f;var ty=340f;var steer=false;var light=100f;var maxLight=100f;var magR=26f;var pcMax=5f;var pR=150f;var guard=0f
            var pc=0f;var inv=0f;var combo=0;var comboT=0f;val cWin=2.2f;val pCost=22f;var depth=0f;var mScore=0;var score=0
            var zi=0;var extra=0f;var scroll=70f;var shake=0f;var flash=0f;var lowF=0f;var deathT=0f;var hintT=0f;var dx0=UW/2f;var dy0=340f
            var rM=0;var rC=0;var rP=0;var rec=false;val cur=Pal(0,0,0,0,0f,0f,0f);private val pf=Pal(0,0,0,0,0f,0f,0f);private val pt=Pal(0,0,0,0,0f,0f,0f);private var palT=1f
            var banner="";var banT=0f;val motes=ArrayList<Mote>(80);private val mp=ArrayDeque<Mote>();val haz=ArrayList<Haz>(16);private val hzp=ArrayDeque<Haz>()
            val ptc=Array(280){Ptc()};private var pcu=0;val ftx=Array(24){Ftx()};private var fcu=0;var ringOn=false;var ringR=0f;var ringT=0f
            val snow=Array(80){Snow()};val walls=arrayOf(Wall(.3f,22f,1),Wall(.3f,22f,2),Wall(.6f,38f,3),Wall(.6f,38f,4))
            private var mT=1f;private var peT=50f;private val hT=FloatArray(3);private var wCd=0f;private var bT=0f;private var rT=0f
            var haptic:((Int)->Unit)?=null;private val bi=floatArrayOf(4.2f,6.2f,9.5f)
            init{cur.set(ZONES[0].p)}
            fun resize(h:Float){H=h;for(w in walls)w.rebuild(h);for(i in snow.indices){val s=snow[i];s.x=Random.nextFloat()*UW;s.y=Random.nextFloat()*h;s.z=i%3;s.ph=Random.nextFloat()*TAU};if(mode==0){px=UW/2f;py=h*.4f}}
            private fun clear(){while(motes.isNotEmpty())mp.addLast(motes.removeAt(motes.size-1));while(haz.isNotEmpty())hzp.addLast(haz.removeAt(haz.size-1));for(p in ptc)p.life=0f;for(f in ftx)f.life=0f;ringOn=false}
            fun attract(){clear();mode=0;light=maxLight;combo=0;comboT=0f;depth=0f;score=0;mScore=0;zi=0;shake=0f;flash=0f;lowF=0f;banT=0f;cur.set(ZONES[0].p);palT=1f;px=UW/2f;py=H*.4f;pvx=0f;pvy=0f;steer=false;mT=.5f}
            fun reset(){clear();maxLight=100f+10f*store.lv(0);magR=26f+9f*store.lv(1);pcMax=5f-.45f*store.lv(2);pR=150f+12f*store.lv(2);guard=.07f*store.lv(3);light=maxLight;mode=1;depth=0f;mScore=0;score=0;zi=0;extra=0f;scroll=ZONES[0].sp;combo=0;comboT=0f;pc=0f;inv=1.2f;shake=0f;flash=0f;lowF=0f;deathT=0f;rM=0;rC=0;rP=0;rec=false;px=UW/2f;py=H*.4f;pvx=0f;pvy=0f;tx=px;ty=py;steer=false;cur.set(ZONES[0].p);palT=1f;mT=.6f;peT=rnd(40f,60f);wCd=0f;hT[0]=4f;hT[1]=6f;hT[2]=10f;hintT=if(!store.hi)7f else 0f;banner=ZONES[0].n;banT=2.6f;audio.zone()}
            private fun se():Float=when(mode){1->scroll;3->scroll*(1f-(deathT/1.2f).coerceIn(0f,1f)*.8f);else->26f}
            fun update(dt:Float){t+=dt;if(mode==2)return;if(palT<1f){palT=min(1f,palT+dt/3.5f);val e=palT*palT*(3f-2f*palT);cur.lerp(pf,pt,e)};shake*=exp(-6f*dt);if(shake<.05f)shake=0f;flash=max(0f,flash-2.6f*dt);lowF=max(0f,lowF-2f*dt);banT=max(0f,banT-dt);if(ringOn){ringT+=dt;val p=min(1f,ringT/.45f);ringR=(1f-(1f-p)*(1f-p))*pR;if(ringT>.6f)ringOn=false};upPtc(dt);upFtx(dt);when(mode){0->attractU(dt);1->playU(dt);3->dieU(dt);4->afterU(dt)};val s=se();for(sn in snow){sn.y-=s*(.12f+.28f*sn.z)*dt;sn.x+=sin(t*.6f+sn.ph)*5f*dt;if(sn.y<-10f){sn.y=H+10f;sn.x=Random.nextFloat()*UW};if(sn.x<-5f)sn.x=UW+5f;if(sn.x>UW+5f)sn.x=-5f};for(w in walls)w.step(s*dt)}
            private fun attractU(dt:Float){val nx=UW/2f+sin(t*.45f)*70f;val ny=H*.4f+sin(t*.7f)*20f;pvx=(nx-px)/max(dt,.001f);pvy=(ny-py)/max(dt,.001f);px=nx;py=ny;mT-=dt;if(mT<=0f){mT=2.2f;spawnM(rnd(30f,UW-30f),H+20f,false)};upMotes(dt,26f)}
            private fun afterU(dt:Float){mT-=dt;if(mT<=0f){mT=3f;spawnM(rnd(30f,UW-30f),H+20f,false)};upMotes(dt,26f);upHaz(dt,26f)}
            private fun dieU(dt:Float){deathT+=dt;pvy-=26f*dt;pvx*=exp(-2f*dt);px+=pvx*dt;py+=pvy*dt;rT-=dt;if(rT<=0f){rT=.07f;spPtc(3,px+rnd(-8f,8f),py+rnd(-6f,6f),rnd(-6f,6f),-rnd(20f,45f),1.4f,rnd(3f,6f),0xFF8FEFFF.toInt())};val s=se();upMotes(dt,s);upHaz(dt,s);if(deathT>1.5f)mode=4}
            private fun zProg():Float{val z=ZONES[zi];val nx=if(zi<ZONES.size-1)ZONES[zi+1].at else z.at+600f;return((depth-z.at)/(nx-z.at)).coerceIn(0f,1f)}
            private fun kAct(k:Int):Boolean{if((ZONES[zi].k and (1 shl k))==0)return false;if(k==0&&zi==0&&depth<55f)return false;return true}
            private fun playU(dt:Float){extra=max(0f,(depth-1800f)/600f);scroll=min(175f,ZONES[zi].sp+extra*6f);depth+=scroll*dt*.12f;score=(depth*2f).toInt()+mScore;var z=0;for(i in ZONES.indices)if(depth>=ZONES[i].at)z=i;if(z!=zi){zi=z;pf.set(cur);pt.set(ZONES[z].p);palT=0f;banner=ZONES[z].n;banT=3.2f;audio.zone();haptic?.invoke(1)};light-=(3.1f+zi*.22f+extra*.1f)*dt;if(light in .01f..24.99f){wCd-=dt;if(wCd<=0f){wCd=2.6f;audio.warn();lowF=1f}};if(light<=0f){die();return};light=min(light,maxLight);pc=max(0f,pc-dt);inv=max(0f,inv-dt);hintT=max(0f,hintT-dt);if(combo>0){comboT-=dt;if(comboT<=0f){combo=0;comboT=0f}};val ax0:Float;val ay0:Float;val k:Float;if(steer){ax0=tx;ay0=ty;k=26f}else{ax0=px+sin(t*.7f)*8f;ay0=py+(H*.45f-py)*.4f;k=3f};pvx+=((ax0-px)*k-pvx*7f)*dt;pvy+=((ay0-py)*k-pvy*7f)*dt;px+=pvx*dt;py+=pvy*dt;if(px<14f){px=14f;pvx=max(0f,pvx)};if(px>UW-14f){px=UW-14f;pvx=min(0f,pvx)};if(py<H*.14f){py=H*.14f;pvy=max(0f,pvy)};if(py>H*.86f){py=H*.86f;pvy=min(0f,pvy)};val spd=hypot(pvx,pvy);bT-=dt;if(spd>50f&&bT<=0f){bT=.07f;spPtc(1,px+rnd(-5f,5f),py+8f,rnd(-8f,8f),rnd(10f,25f),.9f,rnd(1.2f,2.4f),0xFFBFEFFF.toInt())};mT-=dt;if(mT<=0f){mT=(2.1f-min(.4f,zi*.06f))*rnd(.8f,1.2f);spawnPat()};peT-=dt;if(peT<=0f){peT=rnd(38f,60f)-zi*2f;spawnM(rnd(40f,UW-40f),H+30f,true)};val df=ZONES[zi].sm*(1f-.2f*zProg())/(1f+extra*.08f);for(kk in 0..2){if(!kAct(kk))continue;hT[kk]-=dt;if(hT[kk]<=0f){hT[kk]=bi[kk]*df*rnd(.75f,1.3f);if(haz.size<14)spawnH(kk)}};upMotes(dt,scroll);upHaz(dt,scroll)}
            private fun spawnM(x:Float,y:Float,pearl:Boolean):Mote?{if(motes.size>=70)return null;val m=mp.removeFirstOrNull()?:Mote();m.x=x;m.y=y;m.vx=rnd(-5f,5f);m.ph=Random.nextFloat()*TAU;m.pearl=pearl;m.mag=false;motes.add(m);return m}
            private fun spawnPat(){val cx=rnd(50f,UW-50f);val y0=H+40f;when(Random.nextInt(4)){0->{val n=5+Random.nextInt(3);for(i in 0 until n)spawnM(cx+(i-(n-1)/2f)*22f,y0+sin(i*.9f)*18f,false)};1->{val n=4+Random.nextInt(3);for(i in 0 until n)spawnM(cx,y0+i*26f,false)};2->for(i in 0 until 6){val a=i/6f*TAU;spawnM(cx+cos(a)*30f,y0+40f+sin(a)*30f,false)};else->for(i in 0 until 3)spawnM(cx+rnd(-45f,45f),y0+rnd(0f,60f),false)}}
            private fun spawnH(k:Int){val h=hzp.removeFirstOrNull()?:Haz();h.k=k;h.t=0f;h.st=0;h.tn=0;h.vx=0f;h.ph=Random.nextFloat()*TAU;h.rot=Random.nextFloat()*TAU;when(k){0->{h.x=rnd(30f,UW-30f);h.y=H+50f};1->{h.dir=if(Random.nextBoolean())1f else -1f;h.x=if(h.dir>0)-50f else UW+50f;h.y=rnd(H*.55f,H*.95f);h.vx=h.dir*(30f+zi*7f+rnd(0f,18f))};2->{h.dir=if(Random.nextBoolean())1f else -1f;h.by=rnd(H*.3f,H*.75f);h.y=h.by;h.x=if(h.dir>0)-60f else UW+60f}};haz.add(h)}
            private fun upMotes(dt:Float,s:Float){for(i in motes.size-1 downTo 0){val m=motes[i];m.y-=s*dt;m.x+=sin(t*1.4f+m.ph)*6f*dt+m.vx*dt;val dx=px-m.x;val dy=py-m.y;val d=hypot(dx,dy);if(mode==1){if(!m.mag&&d<magR+pr)m.mag=true;if(m.mag&&d>.5f){m.x+=dx/d*300f*dt;m.y+=dy/d*300f*dt};if(d<pr+(if(m.pearl)9f else 4f)+4f){collect(m);mp.addLast(m);motes.removeAt(i);continue}};if(m.y<-40f||m.x<-40f||m.x>UW+40f){mp.addLast(m);motes.removeAt(i)}}}
            private fun collect(m:Mote){if(m.pearl){store.pe+=1;rP++;light=min(maxLight,light+15f);mScore+=150;addFtx(m.x,m.y-12f,"ЖЕМЧУГ +1",11f,0xFFF6F2FF.toInt());burst(m.x,m.y,14,0xFFF6F2FF.toInt(),90f,0,5f,.7f);audio.pearl();haptic?.invoke(3)}else{combo=min(12,combo+1);comboT=cWin;rM++;if(combo>rC)rC=combo;val pts=10*combo;mScore+=pts;light=min(maxLight,light+6f+min(combo,6)*.8f);addFtx(m.x,m.y-8f,"+$pts",8.5f,cur.mote);burst(m.x,m.y,5,cur.mote,60f,0,4f,.5f);audio.collect(combo);haptic?.invoke(0)}}
            private fun upHaz(dt:Float,s:Float){for(i in haz.size-1 downTo 0){val h=haz[i];h.t+=dt;var dead=false;when(h.k){0->{h.y-=s*dt;h.x+=sin(t*.9f+h.ph)*10f*dt;h.rot+=dt*.7f;if(mode==1&&inv<=0f&&hypot(px-h.x,py-h.y)<pr+13f)dmg(18f,h.x,h.y)};1->{if(h.st==0){h.x+=h.vx*dt;h.y-=s*dt;h.y+=sin(t*2f+h.ph)*6f*dt;if((h.x<30f&&h.vx<0f)||(h.x>UW-30f&&h.vx>0f))h.vx=-h.vx;if(mode==1&&inv<=0f&&hypot(px-h.x,py-h.y)<pr+15f)dmg(26f,h.x,h.y)}else{h.x+=h.vx*dt;h.y-=140f*dt;if(h.x<-80f||h.x>UW+80f)dead=true}};2->{if(h.st==0){if(h.t>.85f){h.st=1;h.t=0f;h.x=if(h.dir>0)-60f else UW+60f;audio.dash()}}else{h.x+=h.dir*(300f+zi*18f)*dt;h.y=h.by+sin(h.x*.02f)*14f;if(h.tn<24)h.tn++;System.arraycopy(h.tr,0,h.tr,2,(h.tn-1)*2);h.tr[0]=h.x;h.tr[1]=h.y;if(h.x<-90f||h.x>UW+90f)dead=true;if(mode==1&&inv<=0f){var hit=hypot(px-h.x,py-h.y)<pr+9f;if(!hit){var q=3;while(q<h.tn){if(hypot(px-h.tr[2*q],py-h.tr[2*q+1])<pr+6f){hit=true;break};q+=3}};if(hit)dmg(30f,h.x,h.y)}}}};if(h.k!=2&&h.y<-90f)dead=true;if(dead){hzp.addLast(h);haz.removeAt(i)}}}
            private fun dmg(a:Float,sx:Float,sy:Float){if(inv>0f||mode!=1)return;val am=a*(1f-guard);light-=am;combo=0;comboT=0f;inv=1.2f;shake=9f;flash=1f;val dx=px-sx;val dy=py-sy;val d=max(.5f,hypot(dx,dy));pvx+=dx/d*170f;pvy+=dy/d*170f;burst(px,py,10,0xFFFF3050.toInt(),110f,2,6f,.7f);addFtx(px,py-22f,"-${am.toInt()}",10f,0xFFFF5C7A.toInt());audio.hit();haptic?.invoke(2);if(light<=0f)die()}
            private fun die(){light=0f;mode=3;deathT=0f;steer=false;dx0=px;dy0=py;audio.death();haptic?.invoke(2);store.hi=true;rec=depth.toInt()>store.bd;if(rec)store.bd=depth.toInt();if(score>store.bs)store.bs=score;burst(px,py,24,0xFF8FEFFF.toInt(),60f,3,5f,1.6f)}
            fun tryPulse():Boolean{if(mode!=1||pc>0f)return false;if(light<pCost+2f){addFtx(px,py-24f,"мало света",9f,0xFFFF5C7A.toInt());audio.deny();return false};light-=pCost;pc=pcMax;ringOn=true;ringT=0f;ringR=0f;shake=max(shake,3f);audio.pulse();haptic?.invoke(1);burst(px,py,12,cur.acc,140f,0,5f,.5f);for(m in motes)if(hypot(px-m.x,py-m.y)<pR*1.35f)m.mag=true;for(i in haz.size-1 downTo 0){val h=haz[i];val d=hypot(px-h.x,py-h.y);when(h.k){0->if(d<pR){spawnM(h.x-8f,h.y,false)?.mag=true;spawnM(h.x+8f,h.y,false)?.mag=true;burst(h.x,h.y,8,0xFFFF5C7A.toInt(),100f,0,4f,.5f);audio.shatter();hzp.addLast(h);haz.removeAt(i)};1->if(h.st==0&&d<pR*1.2f){h.st=1;h.vx=(if(h.x>=px)1f else -1f)*rnd(160f,220f)}}};return true}
            private fun spPtc(k:Int,x:Float,y:Float,vx:Float,vy:Float,life:Float,size:Float,col:Int){val p=ptc[pcu];pcu=(pcu+1)%ptc.size;p.k=k;p.x=x;p.y=y;p.vx=vx;p.vy=vy;p.life=life;p.max=life;p.size=size;p.col=col}
            private fun burst(x:Float,y:Float,n:Int,col:Int,s:Float,k:Int,size:Float,life:Float){for(i in 0 until n){val a=Random.nextFloat()*TAU;val v=s*(.4f+Random.nextFloat()*.8f);spPtc(k,x,y,cos(a)*v,sin(a)*v,life*(.6f+Random.nextFloat()*.7f),size*(.6f+Random.nextFloat()*.8f),col)}}
            private fun upPtc(dt:Float){for(p in ptc){if(p.life<=0f)continue;p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;when(p.k){0,2->{val d=exp(-3f*dt);p.vx*=d;p.vy*=d};1->{p.vy-=30f*dt;p.x+=sin(t*6f+p.max*10f)*6f*dt};3->p.vy-=6f*dt}}}
            private fun addFtx(x:Float,y:Float,s:String,size:Float,col:Int){val f=ftx[fcu];fcu=(fcu+1)%ftx.size;f.x=x;f.y=y;f.life=.9f;f.max=.9f;f.s=s;f.size=size;f.col=col}
            private fun upFtx(dt:Float){for(f in ftx){if(f.life<=0f)continue;f.life-=dt;f.y-=26f*dt}} }
